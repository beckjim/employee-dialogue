services:
  nginx:
    image: dhi.io/nginx:1-alpine
    container_name: nginx
    user: "65532:65532"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ghcr.io/beckjim/employee-dialogue:${APP_VERSION:-0.1.0}
    volumes:
      - ./instance:/app/instance
    expose:
      - "5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-emailproxy}
      - SMTP_PORT=${SMTP_PORT:-1587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALLOW_FINALIZED_DELETE_TESTING=${ALLOW_FINALIZED_DELETE_TESTING:-false}
      - EMAIL_REDIRECT_ADDRESS=${EMAIL_REDIRECT_ADDRESS}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - HOME=/tmp
      - TMPDIR=/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
  emailproxy:
    image: blacktirion/email-oauth2-proxy-docker # ghcr.io optional. this is published on both Docker Hub and Github Container Repository
    container_name: emailproxy
    volumes:
      - ./config:/config
    ports:
      - 127.0.0.1:1587:1587
    environment:
      LOGFILE: true
      DEBUG: false
      CACHE_STORE: /config/credstore.config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100

