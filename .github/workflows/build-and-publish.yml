name: Build, Test, and Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Read application version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as project_file:
              app_version = tomllib.load(project_file)["project"]["version"]
          if not isinstance(app_version, str) or not re.fullmatch(
              r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", app_version
          ):
              raise ValueError(f"Application version is not a valid Docker tag: {app_version!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"app_version={app_version}\n")
          PY

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          trivy-version: v0.56.1

      - name: Filesystem vulnerability scan (Trivy)
        id: trivy_scan
        continue-on-error: true
        run: |
          echo "Running Trivy filesystem scan..."
          trivy fs \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --no-progress \
            --exit-code 1 \
            --output trivy-report.txt \
            .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-test
          path: trivy-report.txt
          if-no-files-found: warn

      - name: Fail on Trivy findings
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "Trivy found HIGH/CRITICAL vulnerabilities."
          exit 1

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Publish Docker Image
    # Only publish on push to main branches or on version tags
    if: github.event_name == 'push' && (github.ref_type == 'branch' || github.ref_type == 'tag')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ needs.test.outputs.app_version }},priority=1000
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.test.outputs.app_version }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.app_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.test.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    needs: [test, build-and-publish]
    runs-on: ubuntu-latest
    name: Workflow Summary
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ Workflow failed"
            exit 1
          else
            echo "✅ Workflow completed successfully"
          fi
